[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# Distribution and command: raynsis-inspector. Import name: raynsis_inspector.
name = "raynsis-inspector"
dynamic = ["version"]
description = "Evidence gates for coding agents: block dangerous tool calls and send back claims the transcript cannot prove."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "RAYNSIS AI Workforce" }]
keywords = ["claude-code", "hooks", "guardrails", "agent-governance", "audit", "coding-agents", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/RAYNSIS/inspector"
Issues = "https://github.com/RAYNSIS/inspector/issues"
Changelog = "https://github.com/RAYNSIS/inspector/blob/main/CHANGELOG.md"

[project.scripts]
raynsis-inspector = "raynsis_inspector.cli:main"

[tool.setuptools]
packages = ["raynsis_inspector"]

[tool.setuptools.dynamic]
version = { attr = "raynsis_inspector.__version__" }

[tool.setuptools.package-data]
raynsis_inspector = ["rules/*.json"]
