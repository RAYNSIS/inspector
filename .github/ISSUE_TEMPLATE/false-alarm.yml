name: False alarm
description: A rule fired on something harmless.
labels: ["false alarm"]
body:
  - type: input
    id: rule
    attributes:
      label: Rule id
      placeholder: reply.tests-pass-needs-run
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Exact input and raynsis-inspector check output
      description: Remove secrets and private paths first.
      render: shell
      placeholder: |
        $ raynsis-inspector check bash '...'
        DENY tool....
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why this should pass
  - type: input
    id: version
    attributes:
      label: RAYNSIS Inspector version, Claude Code version, OS
      placeholder: RAYNSIS Inspector 0.2.0 · Claude Code 2.1.327 · macOS 27
