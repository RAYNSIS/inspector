name: Bug
description: kanit crashed, printed an engine error, or behaved differently from the README.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of kanit doctor
      render: shell
  - type: textarea
    id: log
    attributes:
      label: Last lines of .kanit/audit.jsonl (engine_error rows)
      description: Remove secrets and private paths first.
      render: json
  - type: input
    id: version
    attributes:
      label: kanit version, Claude Code version, Python version, OS
