name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: py${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # Python 3.9 has no build for Ubuntu 26.04 (ubuntu-latest), so it runs on 24.04.
        # macOS runs the oldest and newest Python only: hosted macOS runners are scarce.
        include:
          - os: ubuntu-24.04
            python: "3.9"
          - os: windows-latest
            python: "3.9"
          - os: macos-latest
            python: "3.9"
          - os: macos-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Every rule against its own examples
        run: python -m raynsis_inspector test-rules
      - name: Hook end to end (stdin JSON in, one JSON object out)
        shell: bash
        run: |
          out=$(printf '%s' '{"hook_event_name":"PreToolUse","tool_name":"Bash","tool_input":{"command":"rm -rf ~"},"cwd":"."}' | python bin/raynsis-inspector hook)
          echo "$out"
          echo "$out" | python -c "import json,sys; d=json.load(sys.stdin); assert d['hookSpecificOutput']['permissionDecision'] == 'deny'"
      - name: Plugin launcher under the hook shell (Git Bash on Windows)
        shell: bash
        run: |
          payload='{"hook_event_name":"PreToolUse","tool_name":"Bash","tool_input":{"command":"cat .env"},"cwd":"."}'
          deny='import json,sys; d=json.load(sys.stdin); assert d["hookSpecificOutput"]["permissionDecision"] == "deny"'
          out=$(printf '%s' "$payload" | sh hooks/run.sh hook)
          echo "$out"
          echo "$out" | python -c "$deny"
          # the same call behind a dead Microsoft Store shortcut named python3
          stub=$(mktemp -d)/WindowsApps
          mkdir -p "$stub"
          printf '#!/bin/sh\necho "Python was not found; run without arguments to install from the Microsoft Store" >&2\nexit 49\n' > "$stub/python3"
          chmod +x "$stub/python3"
          [ "$(PATH="$stub:$PATH" command -v python3)" = "$stub/python3" ]
          out=$(printf '%s' "$payload" | PATH="$stub:$PATH" sh hooks/run.sh hook)
          echo "$out"
          echo "$out" | python -c "$deny"

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Install the wheel in a clean venv and run it
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install dist/*.whl
          cd /tmp && /tmp/v/bin/raynsis-inspector --version && /tmp/v/bin/raynsis-inspector test-rules && /tmp/v/bin/raynsis-inspector doctor
