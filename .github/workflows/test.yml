name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: py${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Every rule against its own examples
        run: python -m kanit test-rules
      - name: Hook end to end (stdin JSON in, one JSON object out)
        shell: bash
        run: |
          out=$(printf '%s' '{"hook_event_name":"PreToolUse","tool_name":"Bash","tool_input":{"command":"rm -rf ~"},"cwd":"."}' | python bin/kanit hook)
          echo "$out"
          echo "$out" | python -c "import json,sys; d=json.load(sys.stdin); assert d['hookSpecificOutput']['permissionDecision'] == 'deny'"

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Install the wheel in a clean venv and run it
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install dist/*.whl
          cd /tmp && /tmp/v/bin/kanit --version && /tmp/v/bin/kanit test-rules && /tmp/v/bin/kanit doctor
